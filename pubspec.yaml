name: vigiroutes_store
description: VigiRoutes — Application magasin de pièces automobiles
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (notifications push) — memes versions que l'app Pro
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^18.0.1

  # HTTP
  dio: ^5.7.0

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # Localisation (position du magasin à l'inscription)
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # UI / saisie
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  pinput: ^5.0.0
  intl_phone_field: ^3.2.0
  timeago: ^3.6.1

  # Utils
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
